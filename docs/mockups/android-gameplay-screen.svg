<svg width="2400" height="1080" viewBox="0 0 2400 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="overlayTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04110C" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#04110C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101A17" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0C1215" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="hpBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF646E"/>
      <stop offset="100%" stop-color="#FF9A67"/>
    </linearGradient>
    <linearGradient id="oxyBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59D9FF"/>
      <stop offset="100%" stop-color="#7BE7E1"/>
    </linearGradient>
    <linearGradient id="armorBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9DFF33"/>
      <stop offset="100%" stop-color="#D9FF64"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2400" height="1080" rx="42" fill="#040607"/>
  <image href="../../Assets/reference/Background.png" x="0" y="-135" width="2400" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="2400" height="250" fill="url(#overlayTop)"/>
  <rect x="0" y="860" width="2400" height="220" fill="#030607" opacity="0.28"/>

  <ellipse cx="1230" cy="690" rx="170" ry="72" fill="#8EFF2A" opacity="0.1" filter="url(#softGlow)"/>
  <ellipse cx="1230" cy="722" rx="118" ry="26" fill="#000000" opacity="0.42"/>
  <image href="../../Assets/reference/Player.png" x="1040" y="385" width="360" height="540" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>

  <rect x="56" y="48" width="724" height="230" rx="28" fill="url(#panel)" stroke="#385046" stroke-width="3"/>
  <text x="94" y="98" fill="#F2FBF5" font-family="Segoe UI, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700">지상 조사단 · 공장 탐사</text>
  <text x="94" y="136" fill="#9EB5A7" font-family="Segoe UI, Apple SD Gothic Neo, sans-serif" font-size="22">북부 배터리 라인 / 오염 구역 순찰 중</text>

