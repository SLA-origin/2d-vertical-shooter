  <rect x="948" y="968" width="504" height="58" rx="18" fill="url(#panel)" stroke="#364B42" stroke-width="3"/>
  <text x="1200" y="1006" fill="#F2FBF5" font-family="Segoe UI, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="600" text-anchor="middle">배터리 처리 구역 탐색 중 · 산성 누출 흔적 감지</text>
